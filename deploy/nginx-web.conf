server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # The sherpa WASM runtime uses shared memory. Credentialless preserves public CDN assets.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;

    include /etc/nginx/snippets/voice.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Revalidate entry points and modules after a deployment, including at the CDN.
    location ~* \.(html|js)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy credentialless always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
}
