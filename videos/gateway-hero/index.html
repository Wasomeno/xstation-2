<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XTATION - Your Station For Projects And Apps</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Apfel Grotezk";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/ApfelGrotezk-Regular.woff2") format("woff2");
      }

      @font-face {
        font-family: "Apfel Grotezk";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("assets/fonts/ApfelGrotezk-Fett.woff2") format("woff2");
      }

      :root {
        --bg: #f4f5f7;
        --ink: #1c1f26;
        --ivory: #f7f8fa;
        --steel: #5a616c;
        --dim: #6e7580;
        --sans: "Apfel Grotezk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        max-width: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 720px;
        overflow: hidden;
        background: var(--bg);
      }

      #hero {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #field-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        isolation: isolate;
        pointer-events: none;
        transform: translateZ(0);
      }

      #field {
        position: absolute;
        inset: 0;
        perspective: 1680px;
        perspective-origin: 50% 46%;
        transform-style: preserve-3d;
        pointer-events: none;
      }

      #veil {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 48%,
          color-mix(in srgb, var(--bg) 82%, transparent) 0%,
          color-mix(in srgb, var(--bg) 28%, transparent) 18%,
          transparent 42%
        );
      }

      #edge-fade {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--bg) 92%, transparent) 0%,
          transparent 16%,
          transparent 84%,
          color-mix(in srgb, var(--bg) 92%, transparent) 100%
        );
      }

      #site-nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px clamp(20px, 4vw, 56px);
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        pointer-events: auto;
      }

      #brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: var(--ink);
      }

      #brand em {
        font-family: var(--sans);
        font-style: normal;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: none;
      }

      #title-layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 18svh 6vw 16svh;
        gap: 0;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 6;
      }

      #title {
        margin: 0;
        max-width: min(22ch, 92vw);
        text-align: center;
        font-family: var(--sans);
        font-weight: 400;
        font-size: clamp(36px, 5.2vw, 64px);
        line-height: 1.12;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      #title span {
        display: block;
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 78% 72% at 50% 48%,
          transparent 40%,
          color-mix(in srgb, var(--bg) 58%, transparent) 100%
        );
      }

    </style>
    <link rel="stylesheet" href="field.css" />
  </head>
  <body>
    <div id="root">
      <section id="hero">
        <div id="field-stage">
          <div id="field"></div>
        </div>
        <div id="veil"></div>
        <div id="edge-fade"></div>
        <header id="site-nav">
          <a id="brand" href="#root">
            <span>01</span>
            <em>XTATION</em>
          </a>
        </header>
        <div id="title-layer">
          <h1 id="title"><span>Your Station For</span><span>Projects And Apps</span></h1>
        </div>
        <div id="vignette"></div>
      </section>
    </div>

    <script type="module">
      import { createField } from "./field.js";

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const field = createField({
        root: document.getElementById("field"),
        gsap: window.gsap,
        reduce,
      });

      const lines = document.querySelectorAll("#title span");
      if (window.gsap && !reduce) {
        window.gsap.set("#site-nav", { autoAlpha: 0, y: -10 });
        window.gsap.set(lines, { autoAlpha: 0, y: 28 });
        const tl = window.gsap.timeline({ delay: 0.28 });
        tl.to(lines, { autoAlpha: 1, y: 0, duration: 1.05, ease: "expo.out", stagger: 0.11 }, 0);
        tl.to("#site-nav", { autoAlpha: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.18);
      }

      field.startIdle();
    </script>
  </body>
</html>
