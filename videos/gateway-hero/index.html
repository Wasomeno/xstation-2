<!doctype html>
<html lang="en" class="is-welcome">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XTATION - Your Gateway To Intelligent Products</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Apfel Grotezk";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/ApfelGrotezk-Regular.woff2") format("woff2");
      }

      @font-face {
        font-family: "Apfel Grotezk";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("assets/fonts/ApfelGrotezk-Fett.woff2") format("woff2");
      }

      :root {
        --navy: #092328;
        --blue: #2a835f;
        --peri: #8bbb92;
        --sky: #8bbb92;
        --bg: color-mix(in srgb, var(--sky) 10%, #f7faf7);
        --ink: #16181b;
        --ivory: #f3f4f3;
        --steel: #4a5056;
        --dim: #6b7178;
        --surface: color-mix(in srgb, var(--sky) 28%, #f7faf7);
        --line: color-mix(in srgb, var(--ink) 16%, transparent);
        --gold: var(--blue);
        --sans: "Apfel Grotezk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        max-width: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 720px;
        overflow: hidden;
        background: var(--bg);
      }

      #hero {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #field-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        isolation: isolate;
        pointer-events: none;
        background: var(--bg);
        transform: translateZ(0);
        transition: background-color 0.7s cubic-bezier(0.32, 0.72, 0, 1);
      }

      html.is-station #field-stage {
        background: #ffffff;
      }

      html.is-welcome {
        overflow: hidden;
      }

      html.is-welcome #field-stage {
        background: color-mix(in srgb, var(--navy) 28%, var(--bg));
      }

      html.is-welcome #veil,
      html.is-welcome #vignette,
      html.is-welcome #edge-fade {
        opacity: 0.12;
      }

      #field {
        position: absolute;
        inset: 0;
        perspective: 1100px;
        perspective-origin: 50% 48%;
        transform-style: preserve-3d;
        pointer-events: auto;
      }

      html.is-welcome #field {
        pointer-events: none;
      }

      #veil {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 48%,
          rgb(255 255 255 / 0.86) 0%,
          rgb(255 255 255 / 0.22) 18%,
          transparent 42%
        );
      }

      #edge-fade {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgb(255 255 255 / 0.92) 0%,
          transparent 20%,
          transparent 58%,
          rgb(255 255 255 / 0.24) 80%,
          #ffffff 100%
        );
      }

      #site-nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px clamp(20px, 4vw, 56px);
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        pointer-events: auto;
      }

      #brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: inherit;
      }

      #brand em {
        font-family: var(--sans);
        font-style: normal;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: none;
      }

      #title-layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 11svh 6vw 0;
        gap: 0;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 6;
      }

      #title {
        margin: 0;
        max-width: min(28ch, 92vw);
        text-align: center;
        font-family: var(--sans);
        font-weight: 400;
        font-size: clamp(36px, 5.2vw, 64px);
        line-height: 1.12;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      #title span {
        display: block;
      }

      @media (max-width: 767px) {
        #title-layer {
          padding: 12svh 1.1rem 0;
        }

        #title {
          max-width: min(18ch, 92vw);
          font-size: clamp(1.7rem, 7.4vw, 2.15rem);
        }
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 78% 72% at 50% 48%,
          transparent 40%,
          rgb(255 255 255 / 0.58) 100%
        );
      }

    </style>
    <link rel="stylesheet" href="field.css" />
  </head>
  <body>
    <div id="root">
      <section id="hero">
        <div id="field-stage">
          <div id="field"></div>
        </div>
        <div id="veil"></div>
        <div id="edge-fade"></div>
        <header id="site-nav">
          <a id="brand" href="#root">
            <span>01</span>
            <em>XTATION</em>
          </a>
        </header>
        <div id="title-layer">
          <h1 id="title"><span>Your Gateway To</span><span>Intelligent Products</span></h1>
        </div>
        <div id="vignette"></div>
      </section>
    </div>

    <script type="module">
      import { createField } from "./field.js";

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const field = createField({
        root: document.getElementById("field"),
        gsap: window.gsap,
        reduce,
      });

      const lines = document.querySelectorAll("#title span");
      if (window.gsap && !reduce) {
        window.gsap.set("#site-nav", { autoAlpha: 0, y: -10 });
        window.gsap.set(lines, { autoAlpha: 0, y: 28, scale: 0.96 });
        const tl = window.gsap.timeline();
        field.playWelcome();
        tl.to(lines, { autoAlpha: 1, y: 0, scale: 1, duration: 0.72, ease: "expo.out", stagger: 0.08 }, 0.92);
        tl.to("#site-nav", { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.08);
      } else {
        field.startIdle();
      }
    </script>
  </body>
</html>
