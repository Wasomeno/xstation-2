<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gateway — Your Gateway To Intelligent Products</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Apfel Grotezk";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("assets/fonts/ApfelGrotezk-Regular.woff2") format("woff2");
      }

      @font-face {
        font-family: "Apfel Grotezk";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("assets/fonts/ApfelGrotezk-Fett.woff2") format("woff2");
      }

      :root {
        --bg: #000000;
        --ivory: #f3efe6;
        --gold: #d4a056;
        --steel: #9aabc0;
        --dim: #8a93a3;
        --sans: "Apfel Grotezk", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        max-width: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ivory);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 720px;
        overflow: hidden;
        background: var(--bg);
      }

      #hero {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #field-stage {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        isolation: isolate;
        pointer-events: none;
        transform: translateZ(0);
      }

      #field {
        position: absolute;
        inset: 0;
        perspective: 1100px;
        perspective-origin: 50% 48%;
        transform-style: preserve-3d;
        pointer-events: none;
      }

      .slab {
        position: absolute;
        left: 50%;
        top: 50%;
        margin: 0;
        pointer-events: none;
        will-change: transform;
        background: currentColor;
        color: var(--ivory);
        box-shadow:
          0 0 16px currentColor,
          0 0 40px color-mix(in srgb, currentColor 75%, transparent),
          0 0 72px color-mix(in srgb, currentColor 40%, transparent);
      }

      .slab.is-gold {
        color: var(--gold);
        box-shadow:
          0 0 20px var(--gold),
          0 0 48px color-mix(in srgb, var(--gold) 80%, transparent),
          0 0 88px color-mix(in srgb, var(--gold) 45%, transparent);
      }

      .slab.is-steel {
        color: var(--steel);
      }

      .slab.is-dim {
        color: var(--dim);
      }

      #veil {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          ellipse 42% 30% at 50% 50%,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.28) 42%,
          rgba(0, 0, 0, 0) 72%
        );
      }

      #edge-fade {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.78) 0%,
          rgba(0, 0, 0, 0) 16%,
          rgba(0, 0, 0, 0) 84%,
          rgba(0, 0, 0, 0.78) 100%
        );
      }

      #site-nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px clamp(20px, 4vw, 56px);
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ivory);
        pointer-events: auto;
      }

      #brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: var(--ivory);
      }

      #brand em {
        font-family: var(--sans);
        font-style: normal;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: none;
      }

      #title-layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 18svh 6vw 16svh;
        gap: 0;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 6;
      }

      #title {
        margin: 0;
        max-width: min(22ch, 92vw);
        text-align: center;
        font-family: var(--sans);
        font-weight: 400;
        font-size: clamp(36px, 5.2vw, 64px);
        line-height: 1.12;
        letter-spacing: -0.03em;
        color: var(--ivory);
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 78% 72% at 50% 48%,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: var(--bg);
        color: var(--ivory);
        overflow: hidden;
      }

      #boot-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #boot-copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8.5svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        pointer-events: none;
        opacity: 0;
      }

      #boot-word {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.46em;
        text-indent: 0.46em;
        text-transform: uppercase;
        color: var(--ivory);
        opacity: 0.72;
      }

      #boot-rail {
        width: 56px;
        height: 1px;
        background: color-mix(in srgb, var(--ivory) 14%, transparent);
        overflow: hidden;
      }

      #boot-fill {
        width: 100%;
        height: 100%;
        background: var(--gold);
        transform: scaleX(0);
        transform-origin: left center;
      }

      #boot.is-leaving {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Gateway">
      <canvas id="boot-canvas" aria-hidden="true"></canvas>
      <div id="boot-copy">
        <span id="boot-word">Gateway</span>
        <span id="boot-rail" aria-hidden="true"><span id="boot-fill"></span></span>
      </div>
    </div>
    <div id="root">
      <section id="hero">
        <div id="field-stage">
          <div id="field"></div>
        </div>
        <div id="veil"></div>
        <div id="edge-fade"></div>
        <header id="site-nav">
          <a id="brand" href="#root">
            <span>01</span>
            <em>Gateway</em>
          </a>
        </header>
        <div id="title-layer">
          <h1 id="title">Your Gateway To<br />Intelligent Products</h1>
        </div>
        <div id="vignette"></div>
      </section>
    </div>

    <script type="module" src="loader.js"></script>
    <script>
      (function () {
        const DURATION = 8;
        const FAR = -1880;
        const NEAR = 620;
        const TRAVEL = NEAR - FAR;

        const PALETTE = ["ivory", "ivory", "ivory", "ivory", "steel", "steel", "gold", "dim"];

        function mulberry32(seed) {
          let a = seed >>> 0;
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        const rng = mulberry32(0xa5c11e);
        const field = document.getElementById("field");
        const items = [];

        function makeSlab(w, h, color) {
          const el = document.createElement("div");
          el.className = "slab";
          if (color !== "ivory") el.classList.add("is-" + color);
          el.style.width = w + "px";
          el.style.height = h + "px";
          el.setAttribute("aria-hidden", "true");
          return el;
        }

        for (let i = 0; i < 22; i++) {
          const w = 14 + rng() * 36;
          const h = w * (2.8 + rng() * 1.6);
          const color = PALETTE[i % PALETTE.length];
          const el = makeSlab(w, h, color);
          field.appendChild(el);

          const ang = rng() * Math.PI * 2;
          const rad = 300 + rng() * 620;
          let x = Math.cos(ang) * rad;
          let y = Math.sin(ang) * rad * 0.56;
          if (Math.abs(x) < 340) x += x < 0 ? -360 : 360;
          if (Math.abs(y) < 80) y += y < 0 ? -160 : 160;

          items.push({
            el: el,
            phase: (i * 0.097 + rng() * 0.05) % 1,
            x: x,
            y: y,
            tiltX: (rng() - 0.5) * 12,
            tiltY: (rng() - 0.5) * 28,
            peak: color === "gold" ? 0.78 : 0.52,
          });
        }

        function alphaAt(p, peak) {
          if (p < 0.12) return (p / 0.12) * peak;
          if (p > 0.84) return ((1 - p) / 0.16) * peak;
          return peak;
        }

        function layout(t) {
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            const p = (it.phase + t) % 1;
            const z = FAR + p * TRAVEL;
            gsap.set(it.el, {
              x: it.x,
              y: it.y,
              z: z,
              xPercent: -50,
              yPercent: -50,
              rotationX: it.tiltX,
              rotationY: it.tiltY,
              autoAlpha: alphaAt(p, it.peak),
              force3D: true,
            });
          }
        }

        const state = { t: 0 };
        const tl = gsap.timeline();

        tl.fromTo(
          "#site-nav",
          { autoAlpha: 0, y: -10 },
          { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" },
          0.08
        );

        tl.fromTo(
          "#title",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.7, ease: "power1.out" },
          0.25
        );

        tl.fromTo(
          state,
          { t: 0 },
          {
            t: 1,
            duration: DURATION,
            ease: "none",
            repeat: -1,
            onUpdate: function () {
              layout(state.t);
            },
          },
          0
        );

        layout(0);
        tl.pause(0);

        function reveal() {
          tl.play(0);
        }

        if (window.__gatewayReady) reveal();
        else window.addEventListener("gateway:reveal", reveal, { once: true });
      })();
    </script>
  </body>
</html>
